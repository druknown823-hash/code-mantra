<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#58a6ff" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0d1117" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#30363d" stroke-width="4" />
  
  <!-- Vault Outer Shield -->
  <path d="M256 64 L416 128 C416 296 348 396 256 448 C164 396 96 296 96 128 Z" fill="#161b22" stroke="url(#vaultGrad)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Code Brackets inside Vault -->
  <path d="M200 196 L144 256 L200 316" fill="none" stroke="#58a6ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M312 196 L368 256 L312 316" fill="none" stroke="#58a6ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M280 184 L232 328" fill="none" stroke="#3fb950" stroke-width="14" stroke-linecap="round" />
</svg>
